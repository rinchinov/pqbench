[package]
name = "ducklakebench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.91.1"
description = "DuckLake snapshot orchestration and physical storage analysis."

[dependencies]
pqbench = { workspace = true, features = ["ducklake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
duckdb = { workspace = true }
parquet = { version = "59", default-features = false }
tempfile = "3"
